<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiez - M3 Orange Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        :root[data-theme='light'] {
            --primary: #8c5100;
            --on-primary: #ffffff;
            --primary-container: #ffddb7;
            --on-primary-container: #2d1600;
            --secondary: #745a42;
            --on-secondary: #ffffff;
            --secondary-container: #ffdDB6;
            --on-secondary-container: #2a1806;
            --tertiary: #5c6237;
            --on-tertiary: #ffffff;
            --tertiary-container: #e0e7b1;
            --on-tertiary-container: #191e00;
            --error: #ba1a1a;
            --on-error: #ffffff;
            --background: #fdfcff;
            --on-background: #1a1c1e;
            --surface: #fff8f5;
            --on-surface: #201a1a;
            --surface-variant: #f3dfd1;
            --on-surface-variant: #51443a;
            --outline: #847469;
        }

        :root[data-theme='dark'] {
            --primary: #ffb865;
            --on-primary: #4b2900;
            --primary-container: #6b3c00;
            --on-primary-container: #ffddb7;
            --secondary: #e3c1a6;
            --on-secondary: #412d18;
            --secondary-container: #5b432d;
            --on-secondary-container: #ffdDB6;
            --tertiary: #c4cb97;
            --on-tertiary: #2e330d;
            --tertiary-container: #444a22;
            --on-tertiary-container: #e0e7b1;
            --error: #ffb4ab;
            --on-error: #690005;
            --background: #1a1c1e;
            --on-background: #e3e2e6;
            --surface: #1a1c1e;
            --on-surface: #e3e2e6;
            --surface-variant: #51443a;
            --on-surface-variant: #d6c3b6;
            --outline: #9e8d82;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background);
            color: var(--on-background);
            padding: 2rem 4rem;
            margin: 0;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin-bottom: 3rem; border-bottom: 1px solid var(--outline); padding-bottom: 2rem; }
        h1 { font-size: 2.5rem; color: var(--primary); }
        h2 { font-size: 2rem; color: var(--on-surface); }
        p { color: var(--on-surface-variant); max-width: 65ch; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }

        .logo { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 700; color: var(--primary); }

        .theme-toggle {
            background-color: var(--surface-variant);
            color: var(--on-surface-variant);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 700;
        }

        .palette { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; }
        .swatch {
            height: 100px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--outline);
        }

        .components { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
        .card {
            background-color: var(--surface-variant);
            color: var(--on-surface-variant);
            padding: 1.5rem;
            border-radius: 16px;
            width: 300px;
        }
        .card h3 { font-size: 1.5rem; color: var(--on-surface); margin-top: 0; }

        .button-group { display: flex; gap: 1rem; }
        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border: 2px solid transparent;
            border-radius: 24px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-primary { background-color: var(--primary); color: var(--on-primary); }
        .btn-secondary { border-color: var(--outline); color: var(--primary); }
        .fab {
            width: 56px; height: 56px;
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            border-radius: 16px;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header section">
            <h1>M3 Expressive: Orange</h1>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        </div>

        <div class="section">
            <h2>Logo</h2>
            <div class="logo">Kiez</div>
        </div>

        <div class="section">
            <h2>Color Palette</h2>
            <div class="palette">
                <div class="swatch" style="background-color: var(--primary); color: var(--on-primary);">Primary</div>
                <div class="swatch" style="background-color: var(--primary-container); color: var(--on-primary-container);">Container</div>
                <div class="swatch" style="background-color: var(--secondary); color: var(--on-secondary);">Secondary</div>
                <div class="swatch" style="background-color: var(--surface); color: var(--on-surface);">Surface</div>
                <div class="swatch" style="background-color: var(--background); color: var(--on-background);">Background</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Components</h2>
            <div class="components">
                <div class="card">
                    <h3>Explore a Kiez</h3>
                    <p>Discover the hidden gems and local stories that make each neighborhood unique.</p>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary">Start Tour</button>
                    <button class="btn btn-secondary">Learn More</button>
                </div>
                <button class="fab">&#43;</button>
            </div>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
