<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiez - M3 Red Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        :root[data-theme='light'] {
            --primary: #a1323f;
            --on-primary: #ffffff;
            --primary-container: #ffdad9;
            --on-primary-container: #400008;
            --secondary: #775656;
            --on-secondary: #ffffff;
            --secondary-container: #ffdad9;
            --on-secondary-container: #2c1515;
            --tertiary: #755a2f;
            --on-tertiary: #ffffff;
            --tertiary-container: #ffdDB6;
            --on-tertiary-container: #281900;
            --error: #ba1a1a;
            --on-error: #ffffff;
            --background: #fdfcfc;
            --on-background: #201a1a;
            --surface: #fff8f7;
            --on-surface: #201a1a;
            --surface-variant: #f4dddc;
            --on-surface-variant: #524343;
            --outline: #857372;
        }

        :root[data-theme='dark'] {
            --primary: #ffb3b4;
            --on-primary: #670013;
            --primary-container: #831a29;
            --on-primary-container: #ffdad9;
            --secondary: #e6bdbe;
            --on-secondary: #442929;
            --secondary-container: #5d3f3f;
            --on-secondary-container: #ffdad9;
            --tertiary: #e5c18d;
            --on-tertiary: #432c05;
            --tertiary-container: #5b431a;
            --on-tertiary-container: #ffdDB6;
            --error: #ffb4ab;
            --on-error: #690005;
            --background: #1a1c1e;
            --on-background: #e6e1e5;
            --surface: #121315;
            --on-surface: #e6e1e5;
            --surface-variant: #524343;
            --on-surface-variant: #d7c1c1;
            --outline: #a08c8c;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background);
            color: var(--on-background);
            padding: 2rem 4rem;
            margin: 0;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin-bottom: 3rem; border-bottom: 1px solid var(--outline); padding-bottom: 2rem; }
        h1 { font-size: 2.5rem; color: var(--primary); }
        h2 { font-size: 2rem; color: var(--on-surface); }
        p { color: var(--on-surface-variant); max-width: 65ch; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }

        .logo { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 700; color: var(--primary); }

        .theme-toggle {
            background-color: var(--surface-variant);
            color: var(--on-surface-variant);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 700;
        }

        .palette { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; }
        .swatch {
            height: 100px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--outline);
        }

        .components { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
        .card {
            background-color: var(--surface-variant);
            color: var(--on-surface-variant);
            padding: 1.5rem;
            border-radius: 16px;
            width: 300px;
        }
        .card h3 { font-size: 1.5rem; color: var(--on-surface); margin-top: 0; }

        .button-group { display: flex; gap: 1rem; }
        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border: 2px solid transparent;
            border-radius: 24px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-primary { background-color: var(--primary); color: var(--on-primary); }
        .btn-secondary { border-color: var(--outline); color: var(--primary); }
        .fab {
            width: 56px; height: 56px;
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            border-radius: 16px;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header section">
            <h1>M3 Expressive: Red</h1>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        </div>

        <div class="section">
            <h2>Logo</h2>
            <div class="logo">
                <svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <style>
                        .text {
                            font-family: 'Montserrat', sans-serif;
                            font-size: 48px;
                            font-weight: 700;
                            fill: var(--on-surface);
                        }
                        .bg {
                            fill: var(--surface);
                            stroke: var(--outline);
                        }
                        .accent {
                            fill: var(--primary);
                        }
                    </style>
                    <rect width="200" height="80" class="bg" stroke-width="1"/>
                    <circle cx="50" cy="40" r="28" class="accent"/>
                    <text x="32" y="55" class="text">Kiez</text>
                </svg>
            </div>
        </div>

        <div class="section">
            <h2>Color Palette</h2>
            <div class="palette">
                <div class="swatch" style="background-color: var(--primary); color: var(--on-primary);">Primary</div>
                <div class="swatch" style="background-color: var(--primary-container); color: var(--on-primary-container);">Container</div>
                <div class="swatch" style="background-color: var(--secondary); color: var(--on-secondary);">Secondary</div>
                <div class="swatch" style="background-color: var(--surface); color: var(--on-surface);">Surface</div>
                <div class="swatch" style="background-color: var(--background); color: var(--on-background);">Background</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Components</h2>
            <div class="components">
                <div class="card">
                    <h3>Explore a Kiez</h3>
                    <p>Discover the hidden gems and local stories that make each neighborhood unique.</p>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary">Start Tour</button>
                    <button class="btn btn-secondary">Learn More</button>
                </div>
                <button class="fab">&#43;</button>
            </div>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
